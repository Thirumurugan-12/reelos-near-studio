<!doctype html>
<!--
  ReelOS multi-clip reel. backend/reelos/montage.py fills the double-at slots with numbers,
  a style keyword and generated elements only. Every word on screen (title, dates, times,
  captions) arrives through HyperFrames variables bound with data-var-text / textContent.
  Styles: calm (mist, serif), energetic (whips, bold type), clean (hard cuts, minimal type).
-->
<html lang="en" data-resolution="portrait" data-composition-variables='@@VARIABLES@@'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0f0d; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      .shot, .cam { position: absolute; inset: 0; overflow: hidden; }
      .cam video { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
      #veil, #flash { position: absolute; inset: 0; opacity: 0; pointer-events: none; }
      #veil { z-index: 40; background: #050607; }
      #flash { z-index: 41; background: #ffffff; }
      .title-block { position: absolute; left: 0; right: 0; z-index: 50; }
      .place .ch { display: inline-block; }
      .chip { position: absolute; z-index: 45; }
      .pill .time:empty, .pill .cap:empty { display: none; }

      /* calm: mist, serif title, glass timestamp chips */
      [data-style="calm"] #veil { background: radial-gradient(120% 80% at 50% 45%, #f6f7f4 0%, #e9ece8 60%, #dfe3df 100%); }
      [data-style="calm"] .title-block { text-align: center; color: #10201a; }
      [data-style="calm"] #title-open { top: 600px; }
      [data-style="calm"] #title-end { top: 760px; }
      [data-style="calm"] .place { font-family: "EB Garamond", serif; font-size: 168px; line-height: 1;
        text-shadow: 0 0 36px rgba(255, 255, 255, 0.85), 0 0 90px rgba(255, 255, 255, 0.55); }
      [data-style="calm"] #title-end .place { font-size: 150px; text-shadow: none; }
      [data-style="calm"] .dateline { margin-top: 26px; font-family: "Space Mono", monospace; font-weight: 700; font-size: 32px;
        letter-spacing: 0.18em; text-shadow: 0 0 10px #fff, 0 0 26px rgba(255, 255, 255, 0.95); }
      [data-style="calm"] .chip { left: 64px; top: 1196px; }
      [data-style="calm"] .pill { display: inline-flex; align-items: center; gap: 16px; padding: 18px 28px; border-radius: 999px;
        background: rgba(12, 18, 16, 0.62); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.14);
        font-family: "Space Mono", monospace; font-size: 30px; letter-spacing: 0.08em; color: #f2f4f1; white-space: nowrap; }
      [data-style="calm"] .pill .time { font-weight: 700; }
      [data-style="calm"] .pill .dot { width: 12px; height: 12px; border-radius: 50%; background: #9fd3a8; }

      /* energetic: bold uppercase, lime accent, big centred captions */
      [data-style="energetic"] .title-block { text-align: center; color: #ffffff; }
      [data-style="energetic"] #title-open { top: 330px; }
      [data-style="energetic"] #title-end { top: 780px; }
      [data-style="energetic"] .place { font-family: "Archivo Black", sans-serif; font-size: 132px; line-height: 0.95;
        text-transform: uppercase; letter-spacing: -0.02em; text-shadow: 0 8px 40px rgba(0, 0, 0, 0.55); padding: 0 40px; }
      [data-style="energetic"] .dateline { display: inline-block; margin-top: 28px; padding: 10px 22px; background: #eaff81; color: #0b0f0d;
        font-family: "Space Mono", monospace; font-weight: 700; font-size: 30px; letter-spacing: 0.14em; }
      [data-style="energetic"] .dateline:empty { display: none; }
      [data-style="energetic"] .chip { left: 0; right: 0; top: 1040px; text-align: center; }
      [data-style="energetic"] .pill { display: inline-flex; flex-direction: column; align-items: center; gap: 14px; padding: 0 48px; }
      [data-style="energetic"] .pill .dot { display: none; }
      [data-style="energetic"] .pill .time { padding: 6px 16px; background: #eaff81; color: #0b0f0d;
        font-family: "Space Mono", monospace; font-weight: 700; font-size: 28px; letter-spacing: 0.12em; }
      [data-style="energetic"] .pill .cap { font-family: "Archivo Black", sans-serif; font-size: 92px; line-height: 0.95;
        text-transform: uppercase; color: #ffffff; letter-spacing: -0.01em; text-shadow: 0 6px 30px rgba(0, 0, 0, 0.6); }

      /* clean: minimal sans, lower-left captions, fade to black */
      [data-style="clean"] .title-block { text-align: left; color: #ffffff; padding: 0 72px; }
      [data-style="clean"] #title-open { top: 220px; }
      [data-style="clean"] #title-end { top: 820px; text-align: center; }
      [data-style="clean"] .place { font-family: "Inter", sans-serif; font-weight: 700; font-size: 88px; line-height: 1.02;
        letter-spacing: -0.03em; text-shadow: 0 4px 28px rgba(0, 0, 0, 0.5); }
      [data-style="clean"] .dateline { margin-top: 18px; font-family: "Inter", sans-serif; font-weight: 600; font-size: 30px;
        letter-spacing: 0.04em; color: rgba(255, 255, 255, 0.82); text-shadow: 0 2px 16px rgba(0, 0, 0, 0.6); }
      [data-style="clean"] .chip { left: 72px; right: 72px; top: 1150px; }
      [data-style="clean"] .pill { display: flex; flex-direction: column; gap: 10px; padding-left: 22px; border-left: 4px solid #ffffff;
        text-shadow: 0 2px 18px rgba(0, 0, 0, 0.65); }
      [data-style="clean"] .pill .dot { display: none; }
      [data-style="clean"] .pill .time { font-family: "Space Mono", monospace; font-weight: 700; font-size: 26px; color: rgba(255, 255, 255, 0.8); letter-spacing: 0.1em; }
      [data-style="clean"] .pill .cap { font-family: "Inter", sans-serif; font-weight: 700; font-size: 44px; color: #ffffff; letter-spacing: -0.01em; }
    </style>
  </head>
  <body>
    <div id="root" data-style="@@STYLE@@" data-composition-id="main" data-start="0" data-duration="@@TOTAL@@" data-width="1080" data-height="1920" data-motion-blur="on">
@@VIDEOS@@
      <div id="veil"></div>
      <div id="flash"></div>
      <div id="title-open" class="title-block clip" data-start="0" data-duration="@@OPEN_END@@" data-track-index="2">
        <div class="place" id="open-place">Reel</div>
        <div class="dateline" data-var-text="dateline"></div>
      </div>
@@CHIPS@@
      <div id="title-end" class="title-block clip" data-start="@@END_AT@@" data-duration="@@END_DUR@@" data-track-index="2">
        <div class="place" data-var-text="title">Reel</div>
        <div class="dateline" data-var-text="enddate"></div>
      </div>
      <audio id="music" class="clip" src="assets/music.wav" data-start="0" data-media-start="0" data-duration="@@TOTAL@@" data-track-index="6" data-timeline-role="music" data-volume="@@MUSIC_VOLUME@@" data-fade-in="0.3" data-fade-out="@@MUSIC_FADE@@"></audio>
    </div>
    <script>
      const style = document.getElementById("root").dataset.style;
      const vars = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
      const place = document.getElementById("open-place");
      place.textContent = "";
      Array.from(String(vars.title || "Reel")).forEach((c) => {
        const span = document.createElement("span");
        span.className = "ch";
        span.textContent = c === " " ? " " : c;
        place.appendChild(span);
      });
      const tl = gsap.timeline({ paused: true });
      const T = (sel, from, to, at) => tl.fromTo(sel, from, Object.assign({ immediateRender: false }, to), at);
      if (style === "energetic") {
        tl.fromTo("#open-place .ch", { opacity: 0.4, y: 40, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.22, stagger: 0.03, ease: "expo.out" }, 0);
        tl.fromTo("#title-open .dateline", { opacity: 0, scaleX: 0.4 }, { opacity: 1, scaleX: 1, duration: 0.25, ease: "expo.out" }, 0.45);
      } else if (style === "clean") {
        tl.fromTo("#open-place", { opacity: 0.5, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power3.out" }, 0);
        tl.fromTo("#title-open .dateline", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, 0.5);
      } else {
        tl.fromTo("#open-place .ch", { opacity: 0.6, filter: "blur(3px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.25, stagger: 0.04, ease: "power2.out" }, 0);
        tl.fromTo("#title-open .dateline", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power3.out" }, 0.9);
      }
      tl.to("#title-open", { opacity: 0, filter: "blur(8px)", duration: 0.22, ease: "power2.in" }, @@OPEN_OUT@@);
      tl.fromTo("#title-end .place", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power3.out" }, @@END_IN@@);
      tl.fromTo("#title-end .dateline", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power3.out" }, @@END_DATE_IN@@);
      T("#veil", { opacity: 0 }, { opacity: @@VEIL_TO@@, duration: @@VEIL_DUR@@, ease: "power2.inOut" }, @@VEIL_AT@@);
@@TWEENS@@
      tl.set({}, {}, @@TOTAL@@);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
